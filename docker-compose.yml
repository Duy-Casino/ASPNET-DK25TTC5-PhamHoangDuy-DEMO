# Triển khai EduViet bằng Docker Compose: SQL Server 2022 + API + Nginx (frontend).
#   cp .env.example .env    # rồi điền giá trị thật
#   docker compose up -d --build
# Xem docs/11-trien-khai.md

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Thiếu SQL_SA_PASSWORD trong .env}
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=OnlineLearningDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"
      Database__MigrateOnStartup: "true"
      Jwt__SecretKey: ${JWT_SECRET:?Thiếu JWT_SECRET trong .env}
      App__ClientUrl: ${PUBLIC_URL:?Thiếu PUBLIC_URL trong .env}
      Payments__ReturnUrl: ${PUBLIC_URL}/thanh-toan/ket-qua
      Payments__TestGateway__Enabled: ${PAYMENT_TEST_MODE:-false}
      VnPay__TmnCode: ${VNPAY_TMN_CODE:-}
      VnPay__HashSecret: ${VNPAY_HASH_SECRET:-}
      VnPay__BaseUrl: ${VNPAY_BASE_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VnPay__IpnUrl: ${PUBLIC_URL}/api/payments/vnpay/ipn
      MoMo__PartnerCode: ${MOMO_PARTNER_CODE:-}
      MoMo__AccessKey: ${MOMO_ACCESS_KEY:-}
      MoMo__SecretKey: ${MOMO_SECRET_KEY:-}
      MoMo__Endpoint: ${MOMO_ENDPOINT:-https://test-payment.momo.vn/v2/gateway/api/create}
      MoMo__IpnUrl: ${PUBLIC_URL}/api/payments/momo/ipn
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME:-}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY:-}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET:-}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__UserName: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__From: ${SMTP_FROM:-no-reply@example.com}
      Seed__AdminEmail: ${ADMIN_EMAIL:-}
      Seed__AdminPassword: ${ADMIN_PASSWORD:-}
      Cors__AllowedOrigins__0: ${PUBLIC_URL}
      Https__Redirect: ${HTTPS_REDIRECT:-false}
    volumes:
      - apidata:/data
      - uploads:/app/wwwroot/uploads

  web:
    build: ./frontend/online-learning-client
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  sqldata:
  apidata:
  uploads:
