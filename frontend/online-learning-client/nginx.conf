# Phục vụ React (SPA) và chuyển /api, /uploads sang ASP.NET Core API (service "api" trong docker-compose).
# TLS: đặt trước một reverse proxy có HTTPS (Caddy, Traefik, Cloudflare, Nginx khác) hoặc thêm khối listen 443 ssl.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Video bài học tối đa 500 MB
    client_max_body_size 600m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Nếu TLS kết thúc ở proxy phía trước, nó phải gửi X-Forwarded-Proto=https
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    # sitemap.xml do API sinh từ danh sách khóa học đã xuất bản
    location = /sitemap.xml {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    location /uploads/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        expires 7d;
    }

    # File build có hash → cache lâu
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: mọi đường dẫn khác trả index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
